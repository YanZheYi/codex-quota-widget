name: "Build & Release"

on:
  push:
    tags:
      - 'v*' # Trigger build when pushing tags like v0.1.0, v1.0.0, etc.

permissions:
  contents: write # Grants write access to release assets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'macOS'

      - name: Install Rust stable for macOS
        uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: '自动编译生成的跨平台安装包 (Automatic release of Codex Monitor)'
          releaseDraft: true # Creates a draft release so you can review it before publishing
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

      - name: Create Windows Portable Zip
        if: runner.os == 'Windows'
        run: |
          cd src-tauri/target/release
          Compress-Archive -Path "codex-monitor.exe" -DestinationPath "codex-monitor-portable-windows-x64.zip"

      - name: Upload Windows Portable
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/codex-monitor-portable-windows-x64.zip
          draft: true
